<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Taskly</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class = "app">
            <div class = "heading">
                <h1>Taskly.</h1>
                <p class="subtitle">Stay organized, one task at a time.</p>
            </div>

            <div class = "input-section">
                <input id = "todotext" type = "text" placeholder = "Enter a task">
                <button id = "addtask">Add Task</button>
                <button id = "clearcompleted">Clean Up</button>
            </div>
            <ul id = "tasklist"></ul>
        </div>

        <script src = "script.js"></script>
    </body>

</html>
